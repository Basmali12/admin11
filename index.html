<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f3f6f9] text-gray-900 overflow-hidden h-screen w-full relative">
    <div class="fixed inset-0 z-0 pointer-events-none opacity-70">
        <div class="absolute top-[-15%] right-[-10%] w-[500px] h-[500px] rounded-full bg-gradient-to-br from-indigo-300/40 to-purple-300/40 blur-[80px]"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[600px] h-[600px] rounded-full bg-gradient-to-tr from-blue-300/40 to-cyan-300/40 blur-[100px]"></div>
    </div>

    <div id="install-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full text-center shadow-2xl relative border border-gray-100 animate-slide-up">
            <button id="close-install" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 transition-colors bg-gray-50 rounded-full p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <img src="https://raw.githubusercontent.com/mdn/pwa-examples/main/a2hs/images/icon-192.png" alt="App Icon" class="w-20 h-20 mx-auto mb-4 rounded-2xl shadow-md object-cover">
            <h3 class="text-2xl font-extrabold text-gray-800 mb-2">تثبيت التطبيق</h3>
            <p class="text-gray-500 mb-6 font-medium text-sm">قم بتثبيت التطبيق الآن للوصول السريع وتجربة ملء الشاشة بدون الحاجة للمتصفح.</p>
            <button id="install-btn" class="w-full py-3.5 text-lg font-bold text-white bg-indigo-600 rounded-2xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                <i data-lucide="download" class="w-5 h-5"></i>
                تثبيت الآن
            </button>
        </div>
    </div>

    <div id="login-screen" class="relative z-50 flex items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-sm p-8 bg-white/40 backdrop-blur-2xl border border-white/60 rounded-[2rem] shadow-[0_8px_32px_rgba(31,38,135,0.08)]">
            <div class="flex justify-center mb-8">
                <div class="p-4 bg-white/60 backdrop-blur-md shadow-sm border border-white/80 text-indigo-600 rounded-full">
                    <i data-lucide="lock" class="w-8 h-8"></i>
                </div>
            </div>
            <form id="login-form" class="space-y-6">
                <div class="relative">
                    <input type="password" id="password" class="w-full px-5 py-4 text-center text-3xl tracking-[0.5em] bg-white/50 backdrop-blur-md border border-white/60 rounded-2xl outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/20 text-left font-mono transition-all" placeholder="****" dir="ltr" />
                    <p id="login-error" class="hidden text-red-500 text-center mt-2 font-bold transition-all">كلمة المرور خاطئة</p>
                </div>
                <button type="submit" class="w-full py-4 text-lg font-bold text-white bg-indigo-600/90 backdrop-blur-md rounded-2xl hover:bg-indigo-700 active:scale-[0.98] transition-all flex justify-center items-center shadow-lg shadow-indigo-200/50">دخول</button>
            </form>
        </div>
    </div>

    <div id="dashboard" class="hidden relative z-10 flex-col h-screen overflow-hidden">
        <header class="px-6 py-5 bg-white/60 backdrop-blur-2xl border-b border-white/50 flex items-center justify-between z-10 sticky top-0 shadow-[0_4px_30px_rgba(0,0,0,0.03)]">
            <h2 class="text-2xl font-extrabold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent drop-shadow-sm">لوحة الإدارة</h2>
            <button id="logout-btn" class="text-gray-500 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-white/50 border border-transparent hover:border-red-100">
                <i data-lucide="log-out" class="w-6 h-6 rotate-180"></i>
            </button>
        </header>

        <main id="main-content" class="flex-1 overflow-y-auto pb-28 pt-8 px-4 md:px-6 relative">
            <div id="loader" class="flex justify-center p-12 hidden">
                <i data-lucide="loader-2" class="w-10 h-10 animate-spin text-indigo-500"></i>
            </div>
            <div id="content-area" class="w-full max-w-4xl mx-auto pb-6"></div>
        </main>

        <nav class="absolute bottom-0 w-full left-0 bg-white/60 backdrop-blur-2xl border-t border-white/50 z-50 rounded-t-[2rem] shadow-[0_-8px_32px_rgba(31,38,135,0.06)] pb-4">
            <div class="flex justify-around items-center px-4 py-3 max-w-md mx-auto">
                <button class="nav-tab active relative flex flex-col items-center justify-center w-20 py-2 gap-1.5 rounded-2xl transition-all" data-tab="products">
                    <div class="tab-bubble absolute inset-0 bg-indigo-50/80 rounded-xl -z-10 transition-all duration-300"></div>
                    <i data-lucide="package" class="w-6 h-6 icon text-indigo-600"></i>
                    <span class="text-[12px] font-bold text-indigo-600 label">المنتجات</span>
                </button>
                <button class="nav-tab relative flex flex-col items-center justify-center w-20 py-2 gap-1.5 rounded-2xl transition-all" data-tab="ads">
                    <div class="tab-bubble absolute inset-0 bg-indigo-50/80 rounded-xl -z-10 opacity-0 transition-all duration-300 transform scale-95"></div>
                    <i data-lucide="megaphone" class="w-6 h-6 icon text-gray-400"></i>
                    <span class="text-[12px] font-bold text-gray-400 label">الاعلانات</span>
                </button>
                <button class="nav-tab relative flex flex-col items-center justify-center w-20 py-2 gap-1.5 rounded-2xl transition-all" data-tab="banners">
                    <div class="tab-bubble absolute inset-0 bg-indigo-50/80 rounded-xl -z-10 opacity-0 transition-all duration-300 transform scale-95"></div>
                    <i data-lucide="image" class="w-6 h-6 icon text-gray-400"></i>
                    <span class="text-[12px] font-bold text-gray-400 label">البنرات</span>
                </button>
            </div>
        </nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
